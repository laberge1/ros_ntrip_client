host: "caster.example.com"
port: 2101
mountpoint: "MOUNTPOINT"
username: ""
password: ""
user_agent: "NTRIP ros_ntrip_client/0.1"
ntrip_version: "Ntrip/2.0"
tls_enabled: false
tls_verify_peer: true
tls_server_name: ""
tls_ca_cert_file: ""
tls_ca_cert_path: ""
tls_client_cert_file: ""
tls_client_key_file: ""
tls_client_key_password: ""
connect_timeout_sec: 10.0
read_timeout_sec: 10.0
session_start_timeout_sec: 15.0
# Seconds without RTCM data before reconnecting. Some mountpoints transmit at
# 1 Hz or slower; values below 10 may cause unnecessary reconnect churn.
rtcm_timeout_sec: 10.0
adaptive_reconnect: true
adaptive_burst_max_attempts: 12
adaptive_burst_window_sec: 60.0
adaptive_slow_after_sec: 300.0
adaptive_slow_interval_sec: 300.0
reconnect_initial_delay_sec: 10.0
reconnect_max_delay_sec: 300.0
reconnect_backoff_multiplier: 2.0
# Minimum delay between transport-level reconnects. Public casters such as
# RTK2GO require at least 5 seconds; lower values risk IP bans.
transport_reconnect_initial_delay_sec: 5.0
transport_reconnect_max_delay_sec: 10.0
transport_reconnect_backoff_multiplier: 1.5
max_attempts: 0
# Send a GGA sentence to the caster immediately after session acceptance.
# Required for VRS mountpoints to begin receiving corrections.
send_initial_gga: true
gga_topic: "nmea"
rtcm_frame_id: ""
# Interval for periodic GGA resends. Public casters (RTK2GO, Centipede) expect
# GGA every 5-15 seconds for VRS streams; 0 disables periodic sends.
gga_send_interval_sec: 10.0
use_fixed_gga_position: false
fixed_latitude_deg: 0.0
fixed_longitude_deg: 0.0
fixed_altitude_m: 0.0
